name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:package

  publish:
    name: Verify and publish
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run release:check
      - name: Publish npm package through GitHub OIDC
        run: npm publish --access public --tag "$(node scripts/release-dist-tag.mjs)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--verify-tag --generate-notes)
          if [[ "$(node scripts/release-dist-tag.mjs)" == "next" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}"
